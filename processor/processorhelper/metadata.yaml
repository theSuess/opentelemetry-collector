type: processorhelper
github_project: open-telemetry/opentelemetry-collector

status:
  disable_codecov_badge: true
  class: pkg
  stability:
    beta: [traces, metrics, logs]

attributes:
  destination:
    description: The ID of the component receiving data from this processor.
    type: string

telemetry:
  metrics:
    processor_incoming_items:
      enabled: true
      stability: alpha
      description: Number of items passed to the processor.
      unit: "{item}"
      sum:
        value_type: int
        monotonic: true

    processor_internal_duration:
      enabled: true
      stability: alpha
      description: Duration of time taken to process a batch of telemetry data through the processor.
      unit: s
      histogram:
        async: false
        value_type: double

    processor_outgoing_items:
      enabled: true
      stability: alpha
      description: Number of items emitted from the processor.
      unit: "{item}"
      sum:
        value_type: int
        monotonic: true
      attributes: [destination]
